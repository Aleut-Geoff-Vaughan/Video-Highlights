name: docker-publish

# Builds the Video Highlights image and pushes it to Docker Hub.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   Secrets:
#     DOCKERHUB_USERNAME  - your Docker Hub username (e.g. geoffvaughan)
#     DOCKERHUB_TOKEN     - a Docker Hub access token (hub.docker.com >
#                           Account Settings > Personal access tokens)
#   Optional variable:
#     DOCKERHUB_IMAGE     - override the image name
#                           (defaults to geoffvaughan/video-highlights)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${{ vars.DOCKERHUB_IMAGE || 'geoffvaughan/video-highlights' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
