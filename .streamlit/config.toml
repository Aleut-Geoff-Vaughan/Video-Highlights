[server]
# Increase max upload size to 50GB (50000 MB)
maxUploadSize = 50000

# Allow larger message sizes for processing
maxMessageSize = 50000

[browser]
gatherUsageStats = false

[theme]
# Studio dark theme
base = "dark"
primaryColor = "#ff4b4b"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#181b22"
textColor = "#e8eaed"
font = "sans serif"
