services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vh-api
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      VH_DB_URL: sqlite:///./video_highlights_v1.db
      VH_JOB_EXECUTION_MODE: queue
      VH_OUTPUT_ROOT: ./outputs
      VH_LOCAL_STORAGE_ROOT: ./storage
      VH_AUTH_REQUIRED: "false"
      VH_TEST_MODE: "true"
      VH_LOG_LEVEL: DEBUG
      VH_JOB_LOG_DETAIL: extreme
      VH_SKIP_USER_MANAGEMENT: "true"
      VH_BASE_TENANT_SLUG: sandbox
      VH_BASE_TENANT_NAME: Sandbox Tenant
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vh-worker
    command: python -m backend.worker
    environment:
      VH_DB_URL: sqlite:///./video_highlights_v1.db
      VH_JOB_EXECUTION_MODE: queue
      VH_OUTPUT_ROOT: ./outputs
      VH_LOCAL_STORAGE_ROOT: ./storage
      VH_AUTH_REQUIRED: "false"
      VH_TEST_MODE: "true"
      VH_LOG_LEVEL: DEBUG
      VH_JOB_LOG_DETAIL: extreme
      VH_SKIP_USER_MANAGEMENT: "true"
      VH_BASE_TENANT_SLUG: sandbox
      VH_BASE_TENANT_NAME: Sandbox Tenant
    depends_on:
      - api
    volumes:
      - ./:/app

  # GPU worker for NVIDIA rigs (x86_64) and DGX Spark (arm64). Requires the
  # NVIDIA Container Toolkit on the host. `ipc: host` + a large shm stop
  # PyTorch dataloader crashes; job-level knobs (imgsz, stride, model) come
  # from the Create page or the job config.


  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: vh-worker-gpu
    command: python -m backend.worker
    environment:
      VH_DB_URL: sqlite:///./video_highlights_v1.db
      VH_JOB_EXECUTION_MODE: queue
      VH_OUTPUT_ROOT: ./outputs
      VH_LOCAL_STORAGE_ROOT: ./storage
      VH_AUTH_REQUIRED: "false"
      VH_TEST_MODE: "true"
      VH_LOG_LEVEL: DEBUG
      VH_JOB_LOG_DETAIL: extreme
      VH_SKIP_USER_MANAGEMENT: "true"
      VH_BASE_TENANT_SLUG: sandbox
      VH_BASE_TENANT_NAME: Sandbox Tenant
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    profiles: ["gpu"]
    depends_on:
      - api
    volumes:
      - ./:/app
    gpus: all
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
